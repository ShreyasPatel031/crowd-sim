<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Would you buy this?</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #f6f5f1; color: #1b1b1b; }
    main { max-width: 640px; margin: 40px auto; padding: 0 20px 64px; }
    h1 { font-size: 24px; letter-spacing: -0.03em; }
    p { line-height: 1.5; color: #333; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    textarea, input[type="text"] { width: 100%; box-sizing: border-box; border: 1px solid #d4d0c8; border-radius: 8px; padding: 10px 12px; font: inherit; }
    textarea { min-height: 90px; }
    .choices { display: flex; gap: 8px; }
    .choices label { margin: 0; background: #fff; border: 1px solid #e4e0d8; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    button { margin-top: 18px; border: 0; background: #1b1b1b; color: #fff; border-radius: 8px; padding: 10px 16px; font: inherit; font-weight: 600; }
    .ok { background: #dcefdc; color: #1d5c2e; padding: 10px 12px; border-radius: 8px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Would you buy this product?</h1>
    <p>{{ report.brief }}</p>
    <p><a href="{{ report.product_url }}" target="_blank" rel="noopener">Open the listing</a></p>
    {% if thanks %}
      <p class="ok">Thanks — your answer is in the panel report.</p>
    {% else %}
    <form method="post" action="/human/{{ panel_id }}">
      <label>Your call</label>
      <div class="choices">
        <label><input type="radio" name="verdict" value="buy" required /> Buy</label>
        <label><input type="radio" name="verdict" value="maybe" /> Maybe</label>
        <label><input type="radio" name="verdict" value="no" /> No</label>
      </div>
      <label for="rationale">Why?</label>
      <textarea id="rationale" name="rationale" required placeholder="Price, reviews, trust, missing info…"></textarea>
      <button type="submit">Submit</button>
    </form>
    {% endif %}
  </main>
</body>
</html>
