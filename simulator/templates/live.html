<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Running {{ run_id }}</title>
  <style>
    body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 0; background: #f6f5f1; color: #1b1b1b; }
    main { max-width: 880px; margin: 36px auto; padding: 0 20px 64px; }
    a { color: inherit; }
    h1 { font-size: 26px; letter-spacing: -0.03em; margin: 0 0 8px; }
    .muted { color: #5c5c5c; }
    .card { background: #fff; border: 1px solid #e4e0d8; border-radius: 12px; padding: 18px; margin: 16px 0; }
    .status-row { display: flex; align-items: center; gap: 12px; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid #d4d0c8; border-top-color: #1b1b1b;
      border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { font-size: 16px; font-weight: 600; }
    .meta { font-size: 13px; color: #5c5c5c; margin: 8px 0 0; }
    img.shot { width: 100%; border-radius: 10px; border: 1px solid #e4e0d8; background: #fff; margin-top: 12px; }
    ol.steps { list-style: none; padding: 0; margin: 16px 0 0; }
    ol.steps li { padding: 12px 0; border-top: 1px solid #eceae4; font-size: 14px; }
    .step-action { font-weight: 700; }
    .step-detail { font-weight: 500; color: #444; }
    .step-why { margin: 4px 0 0; font-size: 13px; line-height: 1.45; color: #333; }
    .step-why .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: #6a6a6a; margin-right: 6px; }
    .err { background: #fde8e8; color: #8a1f1f; padding: 12px; border-radius: 8px; }
    .back { font-size: 13px; margin-bottom: 18px; display: inline-block; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← New run</a>
    <h1>Running</h1>
    <p class="muted" id="intent-line">{{ progress.intent or "" }} · {{ progress.url or "" }}{% if progress.agent %} · {{ progress.agent }}{% endif %}</p>

    <div class="card" id="status-card">
      <div class="status-row">
        <div class="spinner" id="spinner"></div>
        <div class="status-text" id="status-text">{{ progress.message or "Starting…" }}</div>
      </div>
      <p class="meta" id="status-meta"></p>
      <img class="shot" id="latest-shot" alt="Latest screenshot" hidden />
    </div>

    <div class="card">
      <div class="muted" style="font-size:12px; font-weight:600; margin-bottom:6px;">STEPS SO FAR</div>
      <ol class="steps" id="steps-list"></ol>
    </div>
  </main>
  <script>
    const runId = {{ run_id | tojson }};
    const statusText = document.getElementById("status-text");
    const statusMeta = document.getElementById("status-meta");
    const stepsList = document.getElementById("steps-list");
    const latestShot = document.getElementById("latest-shot");
    const spinner = document.getElementById("spinner");
    const statusCard = document.getElementById("status-card");

    function text(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = value;
      return node;
    }

    function renderSteps(steps) {
      stepsList.innerHTML = "";
      for (const step of steps || []) {
        const li = document.createElement("li");
        const action = step.decision?.action || "?";
        const reason = step.decision?.reason || step.decision?.target_text || "";
        const detail = step.decision?.detail && step.decision.detail !== action ? step.decision.detail : "";

        const head = document.createElement("div");
        head.appendChild(text("span", "step-action", `Step ${step.step}: ${action}`));
        if (detail) head.appendChild(text("span", "step-detail", ` — ${detail}`));
        li.appendChild(head);

        if (reason) {
          const why = document.createElement("div");
          why.className = "step-why";
          why.appendChild(text("span", "lbl", "WHY"));
          why.appendChild(document.createTextNode(reason));
          li.appendChild(why);
        }
        stepsList.appendChild(li);
      }
    }

    function renderLatest(steps) {
      const last = (steps || [])[steps.length - 1];
      if (!last?.screenshot) {
        latestShot.hidden = true;
        return;
      }
      latestShot.hidden = false;
      latestShot.src = `/r/${runId}/shot/${last.screenshot}?t=${Date.now()}`;
    }

    async function poll() {
      try {
        const res = await fetch(`/r/${runId}/status`);
        if (!res.ok) throw new Error("Status unavailable");
        const data = await res.json();
        statusText.textContent = data.message || "Running…";
        const stepCount = (data.steps || []).length;
        const maxSteps = data.max_steps || 30;
        statusMeta.textContent = stepCount
          ? `${stepCount} of up to ${maxSteps} steps · ${data.current_title || data.current_url || ""}`
          : (data.current_title || data.current_url || "");
        renderSteps(data.steps);
        renderLatest(data.steps);

        if (data.status === "done") {
          window.location.reload();
          return;
        }
        if (data.status === "error") {
          spinner.remove();
          statusCard.innerHTML = `<div class="err">${data.error || data.message || "Run failed"}</div>`;
          return;
        }
      } catch (err) {
        statusMeta.textContent = "Waiting for run to start…";
      }
      setTimeout(poll, 1000);
    }

    poll();
  </script>
</body>
</html>
